<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>UTG eLearning — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *{margin:0;padding:3px;box-sizing:border-box}
        :root{
            --forest:darkslategray;
            --moss:#2d6a4f;
            --leaf:#52b788;
            --ink:#0e1a12;
            --paper:#fffff8;
            --cream:#f8f5ef;
            --line:#ddd8ce;
            --muted:#7a7065;
            --err:#9b2226;
        }
        html,body{
            min-height:100%;
            font-family:'Jost',sans-serif;
        }
        body{
            background:var(--forest);
            display:flex;
            flex-direction:column;
            align-items:center;
            min-height:100vh;
            position:relative;
            overflow-x:hidden;
        }

        /* decorative circles */
        body::before{
            content:'';
            position:fixed;
            right:-160px;top:-160px;
            width:600px;height:600px;
            border-radius:50%;
            border:1px solid rgba(255,255,255,0.04);
            pointer-events:none;
        }
        body::after{
            content:'';
            position:fixed;
            left:-100px;bottom:-100px;
            width:420px;height:420px;
            border-radius:50%;
            border:1px solid rgba(255,255,255,0.04);
            pointer-events:none;
        }

        /* ── HEADER / LOGO ── */
        .top-bar{
            width:100%;
            max-width:520px;
            padding:2.5rem 1rem 0;
            display:flex;
            align-items:center;
            gap:14px;
            position:relative;z-index:1;
        }
        .logo-box{
            width:70px;height:60px;
            background:orangered;
            border-radius:12px;
            display:flex;align-items:center;justify-content:center;
            font-family:'Cormorant Garamond',serif;
            font-size:1rem;font-weight:700;color:#fff;
            flex-shrink:0;
        }
        .logo-text{color:#fff;font-size:2rem;font-weight:500;letter-spacing:0.04em;}
        .logo-text span{color:rgba(255,255,255,0.4);font-weight:300;}

        /* ── HERO ── */
        .hero{
            width:100%;
            max-width:520px;
            padding:3rem 1rem 2rem;
            position:relative;z-index:1;
        }
        .hero h1{
            font-family:'Cormorant Garamond',serif;
            font-size:3.4rem;
            line-height:1.08;
            color:black;
            font-weight:700;
            margin-bottom:1.1rem;
        }
        .hero h1 em{color:var(--leaf);font-style:italic;}
        .hero p{
            color:rgba(255,255,255,0.5);
            font-size:0.95rem;
            line-height:1.8;
            max-width:380px;
            font-weight:300;
        }

        /* ── LOGIN CARD ── */
        .card{
            width:100%;
            max-width:700px;
            background:orange;
            border-radius:20px;
            padding:2.2rem 2.2rem 2rem;
            margin: 0 1rem;
            position:relative;z-index:1;
            animation:fadeUp 0.45s ease both;
        }
        .card h2{
            font-family:'Cormorant Garamond',serif;
            font-size:2rem;color:var(--ink);
            margin-bottom:3px;font-weight:700;
        }
        .card > p{
            color:var(--muted);font-size:0.875rem;
            margin-bottom:1.6rem;font-weight:300;
        }
        .role-toggle{
            display:grid;grid-template-columns:1fr 1fr;
            background:darkslategray;border-radius:12px;
            padding:4px;margin-bottom:1.6rem;gap:4px;
        }
        .role-opt{
            padding:0.65rem;text-align:center;
            border-radius:9px;cursor:pointer;
            transition:all 0.2s;font-size:0.875rem;
            font-weight:500;color:white;
            border:none;background:transparent;
            font-family:'Jost',sans-serif;
        }
        .role-opt.active{
            background:#fff;color:var(--forest);
            box-shadow:0 1px 6px rgba(0,0,0,0.08);
        }
        .field{margin-bottom:1rem;}
        .field label{
            display:block;font-size:0.75rem;font-weight:600;
            color:var(--ink);margin-bottom:5px;
            letter-spacing:0.05em;text-transform:uppercase;
        }
        .field input{
            width:100%;padding:0.8rem 1rem;
            border:1.5px solid var(--line);border-radius:10px;
            font-family:'Jost',sans-serif;font-size:0.95rem;
            color:var(--ink);background:darkslategray;outline:none;
            transition:border-color 0.2s;
        }
        .field input:focus{border-color:green;}
        .err-box{
            background:#fff5f5;border:1px solid #ffc9c9;
            color:var(--err);font-size:0.85rem;
            padding:0.7rem 1rem;border-radius:8px;
            margin-bottom:1rem;display:none;
        }
        .submit-btn{
            width:100%;padding:0.9rem;
            background:darkslategray;color:#fff;
            border:none;border-radius:10px;
            font-family:'Jost',sans-serif;font-size:1rem;
            font-weight:500;cursor:pointer;
            transition:background 0.2s;letter-spacing:0.02em;
            margin-top:0.3rem;
        }
        .submit-btn:hover{background:var(--moss);}
        .submit-btn:disabled{opacity:0.65;cursor:not-allowed;}
        .divider{
            text-align:center;color:var(--line);
            font-size:0.85rem;margin:1.1rem 0;
            position:relative;
        }
        .divider::before,.divider::after{
            content:'';position:absolute;top:50%;
            width:42%;height:1px;background:var(--line);
        }
        .divider::before{left:0;}.divider::after{right:0;}
        .alt-link{text-align:center;font-size:0.875rem;color:var(--muted);}
        .alt-link a{color:var(--forest);font-weight:500;text-decoration:none;}

        /* ── FOOTER COUNTERS ── */
        .footer{
            width:100%;max-width:520px;
            padding:2.5rem 1rem 3rem;
            display:flex;gap:2.5rem;
            position:relative;z-index:1;
        }
        .counter{border-left:2px solid var(--leaf);padding-left:1rem;}
        .counter-num{
            font-family:'Cormorant Garamond',serif;
            font-size:2rem;color:#fff;
            font-weight:600;line-height:1;
        }
        .counter-label{
            color:rgba(255,255,255,0.4);
            font-size:0.72rem;margin-top:4px;
            font-weight:300;text-transform:uppercase;
            letter-spacing:0.06em;
        }

        /* spinner */
        .spinner{
            display:inline-block;width:13px;height:13px;
            border:2px solid rgba(255,255,255,0.4);
            border-top-color:#fff;border-radius:50%;
            animation:spin 0.7s linear infinite;
            vertical-align:middle;margin-right:5px;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes fadeUp{
            from{opacity:0;transform:translateY(18px);}
            to{opacity:1;transform:translateY(0);}
        }
        @media screen {
            @media (max-width: 768px) {
                body {
                    background:darkslategray;
                }
            }
            
        }
    </style>
</head>
<body>

<!-- Logo / top bar -->
<div class="top-bar">
    <div class="logo-box">UTG</div>
    <div class="logo-text">eLearning <span>Platform</span></div>
</div>

<!-- Hero headline -->
<div class="hero">
    <h1>Knowledge,<br/><em>distributed</em><br/>for all.</h1>
    <p>A distributed e-learning system connecting students and lecturers across all departments at the University of The Gambia.</p>
</div>

<!-- Login card -->
<div class="card">
    <h2>Welcome back</h2>
    <p>Sign in to access your dashboard</p>

    <div class="role-toggle">
        <button class="role-opt active" onclick="setRole('STUDENT',this)">🎓 Student</button>
        <button class="role-opt" onclick="setRole('LECTURER',this)">👨‍🏫 Lecturer</button>
    </div>

    <div class="err-box" id="errBox"></div>

    <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
    </div>
    <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>

    <button class="submit-btn" id="loginBtn" onclick="doLogin()">Sign In</button>

    <div class="divider">or</div>
    <div class="alt-link">No account? <a href="register.html">Create one here</a></div>
</div>

<!-- Footer counters -->
<div class="footer">
    <div class="counter">
        <div class="counter-num">5+</div>
        <div class="counter-label">Departments</div>
    </div>
    <div class="counter">
        <div class="counter-num">2</div>
        <div class="counter-label">User Roles</div>
    </div>
    <div class="counter">
        <div class="counter-num">∞</div>
        <div class="counter-label">Materials</div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080';
    let selectedRole = 'STUDENT';

    function setRole(r, btn) {
        selectedRole = r;
        document.querySelectorAll('.role-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) { showErr('Please enter your username and password.'); return; }

        const btn = document.getElementById('loginBtn');
        btn.innerHTML = '<span class="spinner"></span>Signing in...';
        btn.disabled = true;

        const credentials = btoa(username + ':' + password);

        try {
            const res = await fetch(`${API}/api/auth/me`, {
                headers: { 'Authorization': 'Basic ' + credentials }
            });

            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('auth', credentials);
                localStorage.setItem('user', JSON.stringify(user));
                window.location.href = user.role === 'LECTURER' ? 'lecturer.html' : 'student.html';
            } else if (res.status === 401) {
                showErr('Invalid username or password.');
            } else {
                showErr('Login failed. Please try again. (Status: ' + res.status + ')');
            }
        } catch (e) {
            showErr('Cannot reach server. Make sure Spring Boot is running on port 8080.');
        } finally {
            btn.innerHTML = 'Sign In';
            btn.disabled = false;
        }
    }

    function showErr(msg) {
        const el = document.getElementById('errBox');
        el.textContent = msg;
        el.style.display = 'block';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
