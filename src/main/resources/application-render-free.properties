# Render free web tier + external free Postgres (e.g. Neon: https://neon.tech).
# In Render, set SPRING_DATASOURCE_* from Neon "Connection details" (use sslmode=require in the URL).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.initialization-fail-timeout=120000
