# Render free web + external Postgres (Neon, etc.).
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD in Render
# (same names as spring.datasource.* — see application.properties). JDBC URL must include sslmode=require for Neon.
# Do not set spring.datasource.url here: it must resolve from env via application.properties.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.initialization-fail-timeout=120000
