# Ephemeral demo: no MySQL. Use: spring-boot.run.profiles=quickdemo
server.port=8081
spring.datasource.url=jdbc:h2:mem:elearning_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

file.upload-dir=${java.io.tmpdir}/elearning-quickdemo-uploads

# Quick tunnels (cloudflared) and local dev
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://[::1]:*,https://*.trycloudflare.com
