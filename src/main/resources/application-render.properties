# Used when SPRING_PROFILES_ACTIVE includes "render" (Render.com + private MySQL).
spring.datasource.url=jdbc:mysql://${RENDER_MYSQL_HOST}:3306/elearning_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${RENDER_MYSQL_USER}
spring.datasource.password=${RENDER_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=120000
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
