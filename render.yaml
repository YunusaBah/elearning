# Free stack: one Render Web Service (free) + external free Postgres (Neon recommended).
# 1) Create a free DB at https://neon.tech → copy JDBC URL, user, and password.
# 2) Render → New → Blueprint → connect this repo → when prompted, paste the three datasource env vars.
# 3) After deploy, open the service URL (https://<name>.onrender.com).
services:
  - type: web
    name: elearning
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render-free
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: "https://*.onrender.com,http://localhost:*,http://127.0.0.1:*,http://[::1]:*"
      - key: FILE_UPLOAD_DIR
        value: /tmp/elearning-uploads
